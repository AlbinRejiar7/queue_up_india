<div class="flex items-center gap-4 p-4 rounded-xl border-2 border-dashed border-slate-200 dark:border-slate-800 opacity-60">

</div>

<div class="max-w-2xl mx-auto flex gap-4">
<button class="flex-1 bg-primary text-white py-4 rounded-full font-bold text-lg shadow-xl shadow-primary/30">
