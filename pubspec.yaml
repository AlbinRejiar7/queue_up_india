name: queue_up_india
description: QueueUp gaming squad finder app foundation.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  go_router: ^16.3.0
  get_it: ^8.2.0
  google_fonts: ^6.3.1
  intl: ^0.20.2
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.3.2
  firebase_core: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/rank_png/
    - assets/pubg/
    - assets/logos/
    - assets/freefire/
